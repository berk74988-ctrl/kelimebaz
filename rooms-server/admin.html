<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kelimebaz — Yönetim Panosu</title>
    <style>
      :root {
        --bg: #14161a;
        --card: #1e2127;
        --line: #2c313a;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #3a7afe;
        --good: #46c93a;
        --bad: #e5484d;
        --warn: #e8a33d;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 14px 20px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        z-index: 2;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        flex: 1;
      }
      .ranges {
        display: flex;
        gap: 6px;
      }
      .ranges button {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
      }
      .ranges button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .tile .n {
        font-size: 28px;
        font-weight: 800;
      }
      .tile .l {
        font-size: 13px;
        color: var(--muted);
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      section h2 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .bars {
        display: grid;
        gap: 8px;
      }
      .bar {
        display: grid;
        grid-template-columns: 130px 1fr 62px;
        gap: 10px;
        align-items: center;
        font-size: 14px;
      }
      .bar .track {
        background: #0f1114;
        border-radius: 6px;
        overflow: hidden;
        height: 20px;
      }
      .bar .fill {
        height: 100%;
        background: var(--accent);
        min-width: 2px;
      }
      .bar .val {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .bar .lbl {
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      .spark {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 60px;
        margin-top: 6px;
      }
      .spark > div {
        flex: 1;
        background: var(--accent);
        min-height: 2px;
        border-radius: 3px 3px 0 0;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 60px 20px;
        font-size: 17px;
      }
      .foot {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin: 20px 0;
      }
      .pill {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #0f1114;
        color: var(--muted);
      }
      .wr-good {
        color: var(--good);
      }
      .wr-bad {
        color: var(--bad);
      }
      .wr-mid {
        color: var(--warn);
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      .filters select,
      .filters input,
      .filters button {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
      }
      .filters button {
        cursor: pointer;
      }
      .wtable th {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .wtable th.sorted::after {
        content: ' ▾';
        color: var(--accent);
      }
      .wtable th.asc::after {
        content: ' ▴';
      }
      tr.out-hard td {
        background: color-mix(in srgb, var(--bad) 12%, transparent);
      }
      tr.out-easy td {
        background: color-mix(in srgb, var(--good) 10%, transparent);
      }
      tr.insufficient {
        opacity: 0.5;
      }
      .mono {
        font-variant-numeric: tabular-nums;
      }
      .rec {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .rec b {
        min-width: 90px;
      }
      .rec .k {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .k-too_hard,
      .k-llm_underrated,
      .k-high_abandon {
        background: #3a1618;
        color: #ff9b9b;
      }
      .k-too_easy,
      .k-llm_overrated {
        background: #17361a;
        color: #7ee787;
      }
      .rlist {
        display: grid;
        gap: 8px;
      }
      .room {
        display: grid;
        grid-template-columns: 70px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
      }
      .room:hover {
        border-color: var(--accent);
      }
      .room .code {
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 1px;
      }
      .room .meta {
        color: var(--muted);
        font-size: 13px;
      }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #0f1114;
        color: var(--muted);
      }
      .badge.flag {
        background: #4a1d1d;
        color: #ffb4b4;
      }
      .badge.lock {
        background: #3a2d16;
        color: #e8c98a;
      }
      .chatbox {
        max-height: 320px;
        overflow-y: auto;
        display: grid;
        gap: 6px;
        margin: 8px 0;
      }
      .cmsg {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 8px;
        border-radius: 8px;
        background: #0f1114;
        font-size: 14px;
      }
      .cmsg.flagged {
        border: 1px solid #7a2b2b;
      }
      .cmsg .who {
        color: var(--muted);
        font-size: 12px;
        min-width: 70px;
      }
      .cmsg .t {
        flex: 1;
        word-break: break-word;
      }
      .cmsg button {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--bad);
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        padding: 1px 7px;
      }
      .modact {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .modact button {
        font: inherit;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
      }
      .modact .danger {
        border-color: var(--bad);
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📊 Kelimebaz — Yönetim Panosu</h1>
      <div class="ranges" id="tabs">
        <button data-t="summary" class="on">Özet</button>
        <button data-t="words">Kelimeler</button>
        <button data-t="rooms">Odalar</button>
        <button data-t="daily">Takvim</button>
        <button data-t="balance">Denge</button>
        <button data-t="ai">🤖 YZ</button>
        <button data-t="aibeh">🎚️ YZ Güç</button>
      </div>
      <div class="ranges" id="ranges">
        <button data-r="today">Bugün</button>
        <button data-r="7d" class="on">7 gün</button>
        <button data-r="30d">30 gün</button>
        <button data-r="all">Tümü</button>
      </div>
      <button
        id="logout"
        title="Çıkış"
        style="
          border: 1px solid var(--line);
          background: var(--card);
          color: var(--text);
          border-radius: 8px;
          padding: 7px 12px;
          cursor: pointer;
        "
      >
        🔓 Çıkış
      </button>
    </header>
    <main id="main"><p class="empty">Yükleniyor…</p></main>

    <script>
      const $ = (s) => document.querySelector(s);
      let range = '7d';

      const pct = (x) => Math.round(x * 100) + '%';
      const esc = (s) =>
        String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
      const wrClass = (x) => (x >= 0.6 ? 'wr-good' : x >= 0.35 ? 'wr-mid' : 'wr-bad');

      const MODE_LABEL = {
        daily: 'Günün Kelimesi',
        practice: 'Serbest',
        room: 'Oda',
        vsai: 'YZ',
        theme: 'Tema',
      };
      const LANG_LABEL = { tr: 'Türkçe', en: 'İngilizce' };

      function bars(entries, opts = {}) {
        const max = Math.max(1, ...entries.map((e) => e.value));
        return `<div class="bars">${entries
          .map(
            (e) =>
              `<div class="bar"><div class="lbl">${esc(e.label)}</div>
               <div class="track"><div class="fill" style="width:${(e.value / max) * 100}%${
                 e.color ? ';background:' + e.color : ''
               }"></div></div>
               <div class="val">${opts.fmt ? opts.fmt(e) : e.value}</div></div>`,
          )
          .join('')}</div>`;
      }

      function render(d) {
        const m = $('#main');
        const noData = d.totals.starts === 0 && d.totals.completed === 0;
        if (noData) {
          m.innerHTML = `<div class="empty">Bu aralıkta henüz veri yok.<br /><span class="pill">Oyun oynandıkça burada görünür.</span></div>`;
          return;
        }

        // Aktivite mini grafiği (günlük başlangıç)
        const act = d.activity;
        const amax = Math.max(1, ...act.map((a) => a.starts));
        const spark = act.length
          ? `<div class="spark">${act
              .map(
                (a) =>
                  `<div title="${a.day}: ${a.starts} başlangıç, ${a.completed} tamamlanan" style="height:${
                    (a.starts / amax) * 100
                  }%"></div>`,
              )
              .join('')}</div>`
          : '';

        const modeEntries = Object.entries(d.modes)
          .sort((a, b) => b[1] - a[1])
          .map(([k, v]) => ({ label: MODE_LABEL[k] || k, value: v }));
        const langEntries = Object.entries(d.langs)
          .sort((a, b) => b[1] - a[1])
          .map(([k, v]) => ({ label: LANG_LABEL[k] || k, value: v }));

        const gd = d.guessDist;
        const guessEntries = [1, 2, 3, 4, 5, 6]
          .map((i) => ({ label: i + ' tahmin', value: gd[i] || 0, color: 'var(--good)' }))
          .concat([{ label: 'Bulamadı', value: gd.fail || 0, color: 'var(--bad)' }]);

        const lenRows = d.byLength
          .map(
            (r) =>
              `<tr><td>${r.wlen} harf</td><td>${r.games}</td>
               <td class="${wrClass(r.winRate)}">${pct(r.winRate)}</td>
               <td>${r.avgAttempts.toFixed(2)}</td></tr>`,
          )
          .join('');

        const vsai = d.vsai;
        const tierRows = vsai.byTier.length
          ? vsai.byTier
              .map(
                (t) =>
                  `<tr><td>${esc(t.tier)}</td><td>${t.games}</td><td class="${wrClass(
                    t.winRate,
                  )}">${pct(t.winRate)}</td></tr>`,
              )
              .join('')
          : `<tr><td colspan="3" class="pill">YZ maçı yok</td></tr>`;

        m.innerHTML = `
          <div class="tiles">
            <div class="tile"><div class="n">${d.totals.starts}</div><div class="l">Oyun başlangıcı</div></div>
            <div class="tile"><div class="n">${d.totals.completed}</div><div class="l">Tamamlanan oyun</div></div>
            <div class="tile"><div class="n ${wrClass(d.winRate)}">${pct(d.winRate)}</div><div class="l">Kazanma oranı (tekil)</div></div>
            <div class="tile"><div class="n">${d.totals.errors}</div><div class="l">Hata olayı</div></div>
          </div>

          <section><h2>Aktivite (günlük başlangıç)</h2>${
            spark || '<span class="pill">tek gün</span>'
          }</section>

          <section><h2>Mod dağılımı</h2>${bars(modeEntries)}</section>
          <section><h2>Dil dağılımı</h2>${bars(langEntries)}</section>
          <section><h2>Tahmin dağılımı (tekil oyun)</h2>${bars(guessEntries)}</section>

          <section><h2>Kelime uzunluğu performansı</h2>
            <table><tr><th>Uzunluk</th><th>Oyun</th><th>Kazanma</th><th>Ort. tahmin</th></tr>${
              lenRows || '<tr><td colspan="4" class="pill">veri yok</td></tr>'
            }</table>
          </section>

          <section><h2>🤖 YZ modu — zorluk & kazanma</h2>
            <p class="pill">Toplam YZ maçı: ${vsai.totalGames} · oyuncu kazanma: ${pct(
              vsai.winRate,
            )}</p>
            <table style="margin-top:10px"><tr><th>Zorluk (tier)</th><th>Maç</th><th>Oyuncu kazanma</th></tr>${tierRows}</table>
          </section>

          <p class="foot">Aralık: ${new Date(d.range.from || 0).toLocaleDateString('tr')} – ${new Date(
            d.range.to,
          ).toLocaleString('tr')} · ${act.length} gün · anonim veri</p>`;
      }

      // --- Kelime raporu ---
      const RECKIND = {
        too_hard: 'çok zor',
        too_easy: 'çok kolay',
        llm_underrated: 'LLM hafife almış',
        llm_overrated: 'LLM abartmış',
        high_abandon: 'yüksek terk',
      };
      let wdata = null; // {rows, recommendations, minSample}
      let sortKey = 'winRate',
        sortAsc = true; // en zor üstte
      const wfilters = { lang: '', len: 0, min: 30 };

      async function loadWords() {
        const base = location.pathname.replace(/\/$/, '');
        const qs = new URLSearchParams({ range });
        if (wfilters.lang) qs.set('lang', wfilters.lang);
        if (wfilters.len) qs.set('len', wfilters.len);
        qs.set('min', wfilters.min);
        try {
          const r = await fetch(base + '/words?' + qs, { headers: { accept: 'application/json' } });
          if (!checkAuth(r)) return;
          if (!r.ok) throw new Error('http ' + r.status);
          wdata = await r.json();
          renderWords();
        } catch (e) {
          $('#main').innerHTML = `<div class="empty">Veri alınamadı: ${esc(e.message)}</div>`;
        }
      }

      function sortRows(rows) {
        const s = [...rows].sort((a, b) => {
          const x = a[sortKey],
            y = b[sortKey];
          if (typeof x === 'string') return (x || '').localeCompare(y || '', 'tr');
          return (x ?? -1) - (y ?? -1);
        });
        return sortAsc ? s : s.reverse();
      }

      function renderWords() {
        const d = wdata;
        const base = location.pathname.replace(/\/$/, '');
        const csvUrl =
          base +
          '/words?' +
          new URLSearchParams({
            range,
            min: wfilters.min,
            format: 'csv',
            ...(wfilters.lang ? { lang: wfilters.lang } : {}),
            ...(wfilters.len ? { len: wfilters.len } : {}),
          });

        const filters = `
          <div class="filters">
            <label>Dil:
              <select id="fLang">
                <option value="">Hepsi</option><option value="tr">Türkçe</option><option value="en">İngilizce</option>
              </select></label>
            <label>Uzunluk:
              <select id="fLen"><option value="0">Hepsi</option>${[4, 5, 6, 7]
                .map((n) => `<option value="${n}">${n} harf</option>`)
                .join('')}</select></label>
            <label>Min. örneklem: <input id="fMin" type="number" min="1" style="width:70px" value="${wfilters.min}" /></label>
            <button id="apply">Uygula</button>
            <span style="flex:1"></span>
            <button id="csv">⬇ CSV</button>
            <button id="json">⬇ JSON</button>
          </div>`;

        if (!d.rows.length) {
          $('#main').innerHTML =
            filters +
            `<div class="empty">Bu filtrede kelime verisi yok.<br /><span class="pill">Oyunlar oynandıkça kelime istatistikleri burada birikir.</span></div>`;
          wireWordControls(csvUrl);
          return;
        }

        const enough = d.rows.filter((r) => r.enough).length;
        const rows = sortRows(d.rows);
        const th = (k, label) =>
          `<th data-k="${k}" class="${sortKey === k ? 'sorted ' + (sortAsc ? 'asc' : '') : ''}">${label}</th>`;

        const body = rows
          .map((r) => {
            const cls = !r.enough
              ? 'insufficient'
              : r.winRate <= 0.25
                ? 'out-hard'
                : r.winRate >= 0.95
                  ? 'out-easy'
                  : '';
            const llm = r.difficulty == null ? '—' : '★'.repeat(r.difficulty);
            return `<tr class="${cls}">
              <td><b>${esc(r.word)}</b></td><td>${r.lang || '—'}</td><td>${r.wlen}</td>
              <td class="mono">${r.plays}</td><td class="mono">${r.completed}</td>
              <td class="mono ${wrClass(r.winRate)}">${r.enough ? pct(r.winRate) : '<span class="pill">az veri</span>'}</td>
              <td class="mono">${r.avgAttempts ? r.avgAttempts.toFixed(2) : '—'}</td>
              <td class="mono">${pct(r.abandonRate)}</td>
              <td title="LLM zorluk 1–5">${llm}</td>
              <td class="mono">${r.sample}</td></tr>`;
          })
          .join('');

        // Öneriler
        const recs = d.recommendations;
        const recHtml = recs.length
          ? recs
              .map(
                (r) =>
                  `<div class="rec"><b>${esc(r.word)}</b><span class="k k-${r.kind}">${
                    RECKIND[r.kind] || r.kind
                  }</span><span>${esc(r.msg)} · kazanma ${pct(r.winRate)}, ort ${r.avgAttempts.toFixed(
                    1,
                  )}, n=${r.sample}${r.difficulty ? ', LLM ' + '★'.repeat(r.difficulty) : ''}</span></div>`,
              )
              .join('')
          : `<div class="rec"><span class="pill">Yeterli örneklemli (n≥${d.minSample}) kelime yok → henüz somut öneri yok.</span></div>`;

        $('#main').innerHTML = `
          ${filters}
          <div class="tiles">
            <div class="tile"><div class="n">${d.rows.length}</div><div class="l">Kelime (veri var)</div></div>
            <div class="tile"><div class="n">${enough}</div><div class="l">Karar için yeterli (n≥${d.minSample})</div></div>
            <div class="tile"><div class="n">${recs.length}</div><div class="l">Havuz önerisi</div></div>
          </div>
          <section><h2>🎯 Havuz önerileri (yalnız yeterli örneklem)</h2>${recHtml}</section>
          <section><h2>Kelime istatistikleri</h2>
            <div style="overflow-x:auto"><table class="wtable">
              <tr>${th('word', 'Kelime')}${th('lang', 'Dil')}${th('wlen', 'Uz.')}${th('plays', 'Oynanma')}${th(
                'completed',
                'Biten',
              )}${th('winRate', 'Kazanma')}${th('avgAttempts', 'Ort. tahmin')}${th('abandonRate', 'Terk')}${th(
                'difficulty',
                'LLM',
              )}${th('sample', 'n')}</tr>
              ${body}
            </table></div>
            <p class="foot" style="text-align:left">Soluk satır = yetersiz örneklem (karar için kullanma). Kırmızı = çok zor, yeşil = çok kolay (uç değer). LLM ★ = zorluk 1–5.</p>
          </section>`;
        wireWordControls(csvUrl);
      }

      function wireWordControls(csvUrl) {
        const set = (id, val) => {
          const el = $('#' + id);
          if (el) el.value = val;
        };
        set('fLang', wfilters.lang);
        set('fLen', wfilters.len);
        const apply = $('#apply');
        if (apply)
          apply.onclick = () => {
            wfilters.lang = $('#fLang').value;
            wfilters.len = Number($('#fLen').value) || 0;
            wfilters.min = Math.max(1, Number($('#fMin').value) || 30);
            loadWords();
          };
        const csv = $('#csv');
        if (csv) csv.onclick = () => (location.href = csvUrl);
        const json = $('#json');
        if (json)
          json.onclick = () => {
            const blob = new Blob([JSON.stringify(wdata, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'kelime-istatistik.json';
            a.click();
          };
        document.querySelectorAll('.wtable th[data-k]').forEach((thEl) => {
          thEl.onclick = () => {
            const k = thEl.dataset.k;
            if (sortKey === k) sortAsc = !sortAsc;
            else {
              sortKey = k;
              sortAsc = k === 'winRate' || k === 'word' || k === 'lang'; // kazanma: en zor üstte
            }
            renderWords();
          };
        });
      }

      // --- Oda denetimi (moderasyon) ---
      let roomsTimer = null,
        openRoom = null; // açık detay oda kodu

      function stopRoomsTimer() {
        if (roomsTimer) {
          clearInterval(roomsTimer);
          roomsTimer = null;
        }
      }

      async function api(path, opts) {
        const base = location.pathname.replace(/\/$/, '');
        const r = await fetch(base + path, opts);
        if (!checkAuth(r)) throw new Error('auth');
        return r;
      }

      const ageStr = (ms) => {
        const s = Math.round(ms / 1000);
        if (s < 60) return s + 's';
        if (s < 3600) return Math.floor(s / 60) + 'dk';
        return Math.floor(s / 3600) + 'sa';
      };
      const STATUS = { lobby: 'lobi', playing: 'oyunda', finished: 'bitti', closed: 'kapalı' };

      async function loadRooms() {
        try {
          const d = await (await api('/rooms')).json();
          renderRooms(d);
        } catch (e) {
          if (e.message !== 'auth')
            $('#main').innerHTML = `<div class="empty">Alınamadı: ${esc(e.message)}</div>`;
        }
      }

      function renderRooms(d) {
        const h = d.health;
        const fillCls = h.fillPct >= 80 ? 'wr-bad' : h.fillPct >= 50 ? 'wr-mid' : 'wr-good';
        const tiles = `
          <div class="tiles">
            <div class="tile"><div class="n">${h.rooms}<span style="font-size:15px;color:var(--muted)">/${h.maxRooms}</span></div><div class="l">Açık oda</div></div>
            <div class="tile"><div class="n ${fillCls}">${h.fillPct}%</div><div class="l">MAX_ROOMS doluluk</div></div>
            <div class="tile"><div class="n">${h.memory.rssMB}<span style="font-size:15px;color:var(--muted)"> MB</span></div><div class="l">Bellek (RSS) · heap ${h.memory.heapUsedMB} MB</div></div>
            <div class="tile"><div class="n">${ageStr(h.uptimeSec * 1000)}</div><div class="l">Sunucu ayakta</div></div>
          </div>`;

        if (!d.rooms.length) {
          $('#main').innerHTML = tiles + `<div class="empty">Şu an açık oda yok.</div>`;
          return;
        }
        const list = d.rooms
          .map(
            (r) => `<div class="room" data-code="${esc(r.code)}">
              <div class="code">${esc(r.code)}</div>
              <div><span class="badge">${STATUS[r.status] || r.status}</span>
                <span class="meta">👥 ${r.playerCount} · 💬 ${r.messageCount} · açık ${ageStr(r.ageMs)} · boş ${ageStr(r.idleMs)}</span>
                ${r.flaggedCount ? `<span class="badge flag">⚠ ${r.flaggedCount} filtreli</span>` : ''}
                ${r.chatLocked ? '<span class="badge lock">🔒 kilitli</span>' : ''}
              </div>
              <div class="meta">detay →</div>
            </div>`,
          )
          .join('');
        $('#main').innerHTML =
          tiles + `<section><h2>Açık odalar (canlı)</h2><div class="rlist">${list}</div></section>`;
        document
          .querySelectorAll('.room')
          .forEach((el) => (el.onclick = () => showRoom(el.dataset.code)));
      }

      async function showRoom(code) {
        stopRoomsTimer(); // detaydayken listeyi yenileme
        openRoom = code;
        try {
          const r = await api('/rooms/detail?code=' + encodeURIComponent(code));
          if (r.status === 404) {
            openRoom = null;
            return loadRooms();
          }
          const d = await r.json();
          const chat = d.messages.length
            ? d.messages
                .map(
                  (m) => `<div class="cmsg ${m.filtered ? 'flagged' : ''}">
                    <span class="who">${esc(m.name)}</span>
                    <span class="t">${esc(m.text)}${m.filtered ? ' <span class="badge flag">filtre</span>' : ''}</span>
                    <button data-id="${esc(m.id)}">sil</button></div>`,
                )
                .join('')
            : '<p class="pill">Mesaj yok</p>';
          const players = d.players
            .map((p) => `${esc(p.name)}${p.isOwner ? ' 👑' : ''}`)
            .join(', ');
          $('#main').innerHTML = `
            <button class="modact" style="margin-bottom:12px" onclick="backToRooms()">← Odalar</button>
            <section>
              <h2>Oda ${esc(d.code)} — ${STATUS[d.status] || d.status}${d.chatLocked ? ' 🔒' : ''}</h2>
              <p class="meta">👥 ${d.players.length}: ${players || '—'} · açık ${ageStr(d.ageMs)} · ⚠ ${d.flaggedCount} filtreli mesaj</p>
              <div class="chatbox">${chat}</div>
              <div class="modact">
                <button class="danger" id="close">Odayı kapat</button>
                <button id="lock">${d.chatLocked ? 'Sohbeti aç' : 'Sohbeti kilitle'}</button>
              </div>
              <p class="foot" style="text-align:left">Yalnız CANLI oda sohbeti gösterilir; geçmiş arşivlenmez. Kalıcı oyuncu kimliği yok → "banla" yok, en fazla oda kapatılır.</p>
            </section>`;
          document
            .querySelectorAll('.cmsg button')
            .forEach((b) => (b.onclick = () => delMsg(code, b.dataset.id)));
          $('#close').onclick = () => closeRoom(code);
          $('#lock').onclick = () => lockRoom(code, !d.chatLocked);
        } catch (e) {
          if (e.message !== 'auth') backToRooms();
        }
      }

      function backToRooms() {
        openRoom = null;
        loadRooms();
        startRoomsTimer();
      }
      window.backToRooms = backToRooms;

      async function post(path, body) {
        return api(path, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
      }
      async function delMsg(code, id) {
        await post('/rooms/message-delete', { code, id });
        showRoom(code);
      }
      async function lockRoom(code, locked) {
        await post('/rooms/lock', { code, locked });
        showRoom(code);
      }
      async function closeRoom(code) {
        const reason = prompt(
          'Kapatma nedeni (oyunculara gösterilir):',
          'Bu oda yönetici tarafından kapatıldı.',
        );
        if (reason == null) return;
        await post('/rooms/close', { code, reason });
        backToRooms();
      }

      function startRoomsTimer() {
        stopRoomsTimer();
        roomsTimer = setInterval(() => {
          if (tab === 'rooms' && !openRoom) loadRooms();
        }, 4000);
      }

      // --- Günün kelimesi takvimi ---
      async function loadDaily() {
        try {
          const d = await (await api('/daily?past=14&future=30')).json();
          renderDaily(d);
        } catch (e) {
          if (e.message !== 'auth')
            $('#main').innerHTML = `<div class="empty">Alınamadı: ${esc(e.message)}</div>`;
        }
      }

      const WD = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
      function cell(x, started) {
        // override varsa vurgula; algo ise soluk. Perf (geçmiş) varsa göster.
        const w = x.override || x.algo || '—';
        const ov = x.override ? ` style="color:var(--accent);font-weight:700"` : '';
        const perf =
          x.winRate != null
            ? ` <span class="pill">${Math.round(x.winRate * 100)}% · n${x.sample}</span>`
            : '';
        return `<span${ov}>${esc(w)}</span>${x.override ? ' ✎' : ''}${perf}`;
      }

      function renderDaily(d) {
        const rows = d.days
          .map((day) => {
            const dt = new Date(day.date + 'T00:00:00Z');
            const wd = WD[dt.getUTCDay()];
            const today = day.isToday ? ' style="outline:1px solid var(--accent)"' : '';
            const tag = day.started ? '<span class="pill">başladı</span>' : '';
            const act = day.started
              ? '<span class="pill">kilitli</span>'
              : `<button data-d="${day.dayIndex}" data-l="tr" class="assign">TR ata</button>
                 <button data-d="${day.dayIndex}" data-l="en" class="assign">EN ata</button>
                 ${day.tr.override || day.en.override ? `<button data-d="${day.dayIndex}" class="clr danger">✕</button>` : ''}`;
            return `<tr${today}>
              <td>${day.date}<br /><span class="pill">${wd}${day.isToday ? ' · bugün' : ''}</span></td>
              <td>${cell(day.tr, day.started)}</td>
              <td>${cell(day.en, day.started)}</td>
              <td>${tag}</td>
              <td class="modact" style="margin:0">${act}</td></tr>`;
          })
          .join('');
        $('#main').innerHTML = `
          <section>
            <h2>Günün kelimesi takvimi</h2>
            <p class="foot" style="text-align:left">Gelecek günlerin kelimesini önceden gör ve gerekirse değiştir. <b>Gün başladıktan sonra değiştirilemez</b> (herkes aynı kelimeyi görmeli). Sunucu erişilemezse istemci gömülü algoritmayı kullanır. ✎ = elle atanmış (override); soluk = algoritmik.</p>
            <div style="overflow-x:auto"><table>
              <tr><th>Tarih</th><th>Türkçe</th><th>İngilizce</th><th>Durum</th><th>Eylem</th></tr>
              ${rows}
            </table></div>
          </section>`;
        document
          .querySelectorAll('.assign')
          .forEach((b) => (b.onclick = () => assignDay(+b.dataset.d, b.dataset.l)));
        document
          .querySelectorAll('.clr')
          .forEach((b) => (b.onclick = () => clearDay(+b.dataset.d)));
      }

      async function assignDay(dayIndex, lang) {
        const word = prompt(
          `${lang.toUpperCase()} — bu güne atanacak kelime (cevap havuzunda olmalı):`,
        );
        if (!word) return;
        const r = await post('/daily/override', { dayIndex, lang, word: word.trim() });
        if (r.status === 422) alert('Bu kelime cevap havuzunda yok. Havuzdaki bir kelime seç.');
        else if (r.status === 409) alert('Bu gün başladı/geçti — değiştirilemez.');
        loadDaily();
      }
      async function clearDay(dayIndex) {
        if (!confirm('Bu günün override’larını kaldır (algoritmaya dön)?')) return;
        await post('/daily/clear', { dayIndex, lang: 'tr' });
        await post('/daily/clear', { dayIndex, lang: 'en' });
        loadDaily();
      }

      // --- Denge ayarları ---
      const GROUP = { gold: '🪙 Altın oranları', ai: '🤖 YZ zorluğu' };
      async function loadBalance() {
        try {
          const d = await (await api('/balance')).json();
          renderBalance(d);
        } catch (e) {
          if (e.message !== 'auth')
            $('#main').innerHTML = `<div class="empty">Alınamadı: ${esc(e.message)}</div>`;
        }
      }

      function renderBalance(d) {
        const groups = {};
        for (const p of d.params) (groups[p.group] = groups[p.group] || []).push(p);
        const sections = Object.entries(groups)
          .map(([g, params]) => {
            const rows = params
              .map(
                (p) => `<tr>
                  <td>${esc(p.label)}<br /><span class="pill">${esc(p.key)} · aralık ${p.min}–${p.max}</span></td>
                  <td><input class="bval" data-k="${p.key}" data-min="${p.min}" data-max="${p.max}" type="number" step="${p.int ? 1 : 0.05}" value="${p.current}" style="width:90px" /></td>
                  <td class="mono">${p.def}${p.overridden ? ' <span class="badge lock">override</span>' : ''}</td>
                  <td class="modact" style="margin:0">
                    <button class="bset" data-k="${p.key}">Kaydet</button>
                    ${p.overridden ? `<button class="brst danger" data-k="${p.key}">↺ Varsayılan</button>` : ''}
                  </td></tr>`,
              )
              .join('');
            return `<section><h2>${GROUP[g] || g}</h2>
              <table><tr><th>Ayar</th><th>Değer</th><th>Varsayılan</th><th>Eylem</th></tr>${rows}</table></section>`;
          })
          .join('');
        const anyOverride = d.params.some((p) => p.overridden);
        const hist = d.history.length
          ? d.history
              .map(
                (h) =>
                  `<div class="rec"><b>${esc(h.key)}</b><span>${h.from} → ${h.to}${h.reset ? ' (geri al)' : ''} · <span class="pill">${new Date(h.at).toLocaleString('tr')}</span></span></div>`,
              )
              .join('')
          : '<div class="rec"><span class="pill">Henüz değişiklik yok</span></div>';
        $('#main').innerHTML = `
          <p class="foot" style="text-align:left">Kod içi değerler <b>varsayılan</b>; buradan değiştirince istemci sunucu değerini kullanır (aralığa sıkıştırılır). Sunucu erişilemezse oyun gömülü varsayılanla çalışır. Aralık dışı değer <b>reddedilir</b>. Oyuncuların mevcut altını/envanteri <b>etkilenmez</b> — yalnız bundan sonraki kazançlar/zorluk değişir.</p>
          ${anyOverride ? '<div class="modact" style="margin-bottom:12px"><button class="danger" id="brstall">↺ Tümünü varsayılana döndür</button></div>' : ''}
          ${sections}
          <section><h2>Değişiklik geçmişi</h2>${hist}</section>`;
        document
          .querySelectorAll('.bset')
          .forEach((b) => (b.onclick = () => setBalance(b.dataset.k)));
        document
          .querySelectorAll('.brst')
          .forEach((b) => (b.onclick = () => resetBalance(b.dataset.k)));
        const all = $('#brstall');
        if (all)
          all.onclick = async () => {
            if (!confirm('Tüm denge ayarlarını varsayılana döndür?')) return;
            await post('/balance/reset', { all: true });
            loadBalance();
          };
      }

      async function setBalance(key) {
        const inp = document.querySelector(`.bval[data-k="${key}"]`);
        const value = Number(inp.value);
        const min = +inp.dataset.min,
          max = +inp.dataset.max;
        if (!Number.isFinite(value) || value < min || value > max) {
          alert(`Aralık dışı: ${min}–${max} arası bir değer gir.`); // istemci denetimi
          return;
        }
        const r = await post('/balance/set', { key, value });
        if (r.status === 400) alert('Sunucu reddetti (aralık dışı).');
        loadBalance();
      }
      async function resetBalance(key) {
        await post('/balance/reset', { key });
        loadBalance();
      }

      // --- 🤖 YZ ayarları ---
      let AISCHEMA = null; // son yüklenen şema (model kataloğu + mevcut config)
      const EFFORT_RANK = { low: 0, medium: 1, high: 2, xhigh: 3, max: 4 };

      async function loadAI() {
        try {
          const d = await (await api('/ai')).json();
          renderAI(d);
        } catch (e) {
          if (e.message !== 'auth')
            $('#main').innerHTML = `<div class="empty">Alınamadı: ${esc(e.message)}</div>`;
        }
      }

      function currentModelSpec() {
        const id = $('#aiModel').value;
        return AISCHEMA.schema.models.find((m) => m.id === id);
      }

      // Model/effort değişince: effort seçenekleri + "disabled" kuralını UI'da uygula.
      function syncAiControls() {
        const m = currentModelSpec();
        const thinkWrap = $('#aiThinkWrap');
        const effWrap = $('#aiEffWrap');
        const note = $('#aiNote');
        if (!m.effort) {
          // haiku: thinking/output_config almaz → alanlar gizlenir
          thinkWrap.style.display = 'none';
          effWrap.style.display = 'none';
          note.textContent =
            'Bu model thinking/effort parametresi almaz — yalnız model + max_tokens gönderilir.';
          return;
        }
        thinkWrap.style.display = '';
        effWrap.style.display = '';
        // effort seçeneklerini modele göre yeniden kur (seçili değeri koru)
        const effSel = $('#aiEffort');
        const prev = effSel.value;
        effSel.innerHTML = m.effortLevels.map((e) => `<option value="${e}">${e}</option>`).join('');
        if (m.effortLevels.includes(prev)) effSel.value = prev;
        // "disabled" seçeneği: model ailesi kuralı
        const thinkSel = $('#aiThinking');
        const optDisabled = thinkSel.querySelector('option[value="disabled"]');
        const maxD = m.disabledMaxEffort;
        if (maxD == null) {
          optDisabled.disabled = true;
          if (thinkSel.value === 'disabled') thinkSel.value = 'adaptive';
          note.textContent = 'Bu modelde düşünme daima açık — thinking yalnız "adaptive" olabilir.';
        } else {
          const allowed = EFFORT_RANK[effSel.value] <= EFFORT_RANK[maxD];
          optDisabled.disabled = !allowed;
          if (!allowed && thinkSel.value === 'disabled') thinkSel.value = 'adaptive';
          note.textContent = `thinking="disabled" yalnız effort ≤ ${maxD} iken kullanılabilir.`;
        }
      }

      function renderAI(d) {
        AISCHEMA = d;
        const s = d.schema;
        const cur = s.current;
        const key = d.keyDefined
          ? `<span class="badge lock">tanımlı</span> <span class="pill">${esc(d.keyPrefix)}</span>`
          : `<span class="badge flag">tanımlı değil</span>`;
        const modelOpts = s.models
          .map(
            (m) =>
              `<option value="${m.id}"${m.id === cur.model ? ' selected' : ''}>${esc(m.label)} — $${m.inUsd}/$${m.outUsd} (1M gir/çık)</option>`,
          )
          .join('');
        const hist = d.history.length
          ? d.history
              .map((h) => {
                const f = h.from || {},
                  t = h.to || {};
                const fS = `${f.model}·${f.thinking}·${f.effort}·${f.maxTokens}t`;
                const tS = `${t.model}·${t.thinking}·${t.effort}·${t.maxTokens}t`;
                return `<div class="rec"><b>${h.reset ? 'geri al' : 'değişiklik'}</b><span>${esc(fS)} → ${esc(tS)} · <span class="pill">${new Date(h.at).toLocaleString('tr')}</span></span></div>`;
              })
              .join('')
          : '<div class="rec"><span class="pill">Henüz değişiklik yok</span></div>';

        $('#main').innerHTML = `
          <p class="foot" style="text-align:left">Çalışma zamanı Claude modeli ve çağrı parametreleri — <b>yeniden başlatmadan</b> buradan yönetilir. Geçersiz kombinasyon <b>reddedilir</b> (hem burada hem sunucuda). Model ya da API hatasında oyun <b>gömülü varsayılana</b> düşer, ipucu sessizce şablon davranışına iner — kullanıcı hata görmez. <b>Güvenlik:</b> API anahtarı sunucu ortam değişkeninde kalır, panele asla gönderilmez.</p>
          <section>
            <h2>API anahtarı</h2>
            <p style="margin:6px 0">${key}</p>
            ${d.keyDefined ? '' : '<p class="foot" style="text-align:left">Anahtar tanımlı değil → ipucu özelliği kapalı, canlı test yapılamaz. Sunucuda <span class="pill">ANTHROPIC_API_KEY</span> ayarlanmalı.</p>'}
          </section>
          <section>
            <h2>Model ve parametreler ${s.overridden ? '<span class="badge lock">override</span>' : '<span class="pill">varsayılan</span>'}</h2>
            <div class="filters">
              <label>Model <select id="aiModel">${modelOpts}</select></label>
              <label id="aiThinkWrap">Thinking
                <select id="aiThinking">
                  <option value="adaptive"${cur.thinking === 'adaptive' ? ' selected' : ''}>adaptive</option>
                  <option value="disabled"${cur.thinking === 'disabled' ? ' selected' : ''}>disabled</option>
                </select></label>
              <label id="aiEffWrap">Effort <select id="aiEffort"></select></label>
              <label>max_tokens
                <input id="aiMax" type="number" min="${s.maxTokensRange.min}" max="${s.maxTokensRange.max}" step="1" value="${cur.maxTokens}" style="width:90px" /></label>
            </div>
            <p class="foot" id="aiNote" style="text-align:left;margin:6px 0"></p>
            <div class="modact">
              <button class="bset" id="aiSave">Kaydet</button>
              ${s.overridden ? '<button class="danger" id="aiReset">↺ Varsayılana döndür</button>' : ''}
              <button id="aiTest"${d.keyDefined ? '' : ' disabled'}>⚡ Canlı test</button>
            </div>
            <div id="aiTestOut"></div>
          </section>
          <section><h2>Değişiklik geçmişi</h2>${hist}</section>`;

        // effort seçeneklerini mevcut modele göre kur (seçili effort korunur)
        const m = s.models.find((x) => x.id === cur.model);
        if (m.effort) {
          $('#aiEffort').innerHTML = m.effortLevels
            .map((e) => `<option value="${e}"${e === cur.effort ? ' selected' : ''}>${e}</option>`)
            .join('');
        }
        syncAiControls();

        $('#aiModel').onchange = syncAiControls;
        $('#aiEffort').onchange = syncAiControls;
        $('#aiSave').onclick = saveAI;
        const rst = $('#aiReset');
        if (rst) rst.onclick = resetAI;
        $('#aiTest').onclick = testAI;
      }

      async function saveAI() {
        const m = currentModelSpec();
        const model = $('#aiModel').value;
        const maxTokens = Number($('#aiMax').value);
        const range = AISCHEMA.schema.maxTokensRange;
        if (!Number.isFinite(maxTokens) || maxTokens < range.min || maxTokens > range.max) {
          alert(`max_tokens aralık dışı: ${range.min}–${range.max}`); // istemci denetimi
          return;
        }
        const payload = { model, maxTokens };
        if (m.effort) {
          payload.thinking = $('#aiThinking').value;
          payload.effort = $('#aiEffort').value;
        } else {
          payload.thinking = 'adaptive'; // haiku: sunucu yok sayar
          payload.effort = 'low';
        }
        const r = await post('/ai/set', payload);
        if (r.status === 400) {
          const j = await r.json().catch(() => ({}));
          alert('Sunucu reddetti: ' + (j.error || 'geçersiz kombinasyon'));
          return;
        }
        loadAI();
      }

      async function resetAI() {
        if (!confirm('YZ ayarını gömülü varsayılana döndür?')) return;
        await post('/ai/reset', {});
        loadAI();
      }

      async function testAI() {
        const out = $('#aiTestOut');
        out.innerHTML =
          '<p class="foot" style="text-align:left">Test çalışıyor… (yüksek effort seçildiyse sürebilir)</p>';
        const r = await post('/ai/test', {});
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.error) {
          out.innerHTML = `<div class="rec"><b>Test başarısız</b><span>${esc(j.error || 'hata')}${j.detail ? ' · ' + esc(j.detail) : ''}</span></div>`;
          return;
        }
        out.innerHTML = `<section style="margin-top:10px"><h2>Canlı test sonucu</h2>
          <p style="margin:6px 0"><span class="pill">${esc(j.model)}</span> <span class="pill">${j.latencyMs} ms</span> <span class="pill">girdi ${j.inputTokens} tok</span> <span class="pill">çıktı ${j.outputTokens} tok</span></p>
          <div class="rec"><span>${esc(j.text)}</span></div></section>`;
      }

      // --- 🎚️ YZ Güç (davranış + ölçüm) ---
      const ABGROUP = {
        diff: '🎚️ Zorluk (band + tempo)',
        persona: '🎭 Karakterler (aç/kapa + ağırlık)',
        adapt: '📈 Uyarlanabilir zorluk eşikleri',
        hint: '🆘 İpucu koçu',
      };
      const RESULT_LABEL = {
        'diff.hard': '🔴 Zor',
        'diff.medium': '🟡 Orta',
        'diff.easy': '🟢 Kolay',
        'persona.temkinli': '🛡️ Temkinli',
        'persona.unlu': '🎯 Ünlü Avcısı',
        'persona.harfsayar': '🔢 Harf Sayar',
        'persona.kumarbaz': '🎲 Kumarbaz',
      };
      let ABDATA = null;

      async function loadAIBeh() {
        try {
          const d = await (await api('/ai-behavior')).json();
          renderAIBeh(d);
        } catch (e) {
          if (e.message !== 'auth')
            $('#main').innerHTML = `<div class="empty">Alınamadı: ${esc(e.message)}</div>`;
        }
      }

      function renderMeasureHtml(m) {
        const r = m.results || {};
        const persKeys = Object.keys(r).filter((k) => k.startsWith('persona.'));
        const row = (k) => {
          const x = r[k];
          if (!x) return '';
          const tKey = k.replace('diff.', '');
          const tgt = m.target && m.target[tKey];
          let flag = '';
          if (tgt != null) {
            const off = Math.abs(x.avg - tgt) > m.tol;
            flag = off
              ? `<span class="badge flag">hedef ${tgt}±${m.tol} dışı</span>`
              : `<span class="badge lock">hedefte</span>`;
          }
          return `<tr><td>${RESULT_LABEL[k] || esc(k)}</td><td class="mono">${x.avg}</td><td class="mono">${tgt != null ? tgt : '—'}</td><td class="mono">${x.unsolvedPct}%</td><td>${flag}</td></tr>`;
        };
        const diffRows = ['diff.hard', 'diff.medium', 'diff.easy'].map(row).join('');
        const persRows = persKeys.map(row).join('');
        return `<div style="overflow-x:auto"><table style="margin-top:10px"><tr><th>Kol</th><th>Ort. tahmin</th><th>Hedef</th><th>Çözemedi</th><th></th></tr>
          ${diffRows}${persRows ? `<tr><td colspan="5"><span class="pill">Karakterler (ortalama ölçümden — elle yazılmaz)</span></td></tr>${persRows}` : ''}</table></div>
          <p class="foot" style="text-align:left">Ölçüm: ${m.at ? new Date(m.at).toLocaleString('tr') : 'şimdi'}</p>`;
      }

      function renderAIBeh(d) {
        ABDATA = d;
        const groups = {};
        for (const p of d.params) (groups[p.group] = groups[p.group] || []).push(p);
        const sections = ['diff', 'persona', 'adapt', 'hint']
          .filter((g) => groups[g])
          .map((g) => {
            const rows = groups[g]
              .map(
                (p) => `<tr>
                  <td>${esc(p.label)}<br /><span class="pill">${esc(p.key)} · ${p.min}–${p.max}</span></td>
                  <td><input class="abval" data-k="${p.key}" data-min="${p.min}" data-max="${p.max}" type="number" step="${p.int ? 1 : 0.05}" value="${p.current}" style="width:90px" /></td>
                  <td class="mono">${p.def}${p.overridden ? ' <span class="badge lock">override</span>' : ''}</td>
                  <td class="modact" style="margin:0">
                    <button class="abset" data-k="${p.key}">Kaydet</button>
                    ${p.overridden ? `<button class="abrst danger" data-k="${p.key}">↺</button>` : ''}
                  </td></tr>`,
              )
              .join('');
            return `<section><h2>${ABGROUP[g] || g}</h2><table><tr><th>Ayar</th><th>Değer</th><th>Varsayılan</th><th>Eylem</th></tr>${rows}</table></section>`;
          })
          .join('');
        const anyOverride = d.params.some((p) => p.overridden);
        const hist = d.history.length
          ? d.history
              .map(
                (h) =>
                  `<div class="rec"><b>${esc(h.key)}</b><span>${h.from} → ${h.to}${h.reset ? ' (geri al)' : ''} · <span class="pill">${new Date(h.at).toLocaleString('tr')}</span></span></div>`,
              )
              .join('')
          : '<div class="rec"><span class="pill">Henüz değişiklik yok</span></div>';

        $('#main').innerHTML = `
          <p class="foot" style="text-align:left">YZ rakip gücü ve ipucu koçu — <b>yeniden başlatmadan</b> ayarlanır. Aralık dışı değer <b>reddedilir</b>. Ayar değişikliği <b>süren maçları bozmaz</b> (bot config'i maç başında sabitlenir). Sunucu erişilemezse oyun gömülü varsayılanla çalışır.</p>
          <section>
            <h2>📐 Ölçüm — "değiştir · ölç · uygula"</h2>
            <p class="foot" style="text-align:left;margin:6px 0">Seçili ayarla N maç simüle eder; her zorluğun/karakterin ortalama tahmin sayısını gösterir — sonucu oyunculara yansıtmadan önce görürsün. Ölçüm ayrı thread'de koşar (sunucu kilitlenmez), aynı anda tek çalıştırma, ${d.matchesCap} maç üst sınırı, 5 dk önbellek.</p>
            <div class="filters">
              <label>Kol başına maç <input id="abMatches" type="number" min="20" max="${d.matchesCap}" step="10" value="${d.matchesDefault}" style="width:90px" /></label>
              <button id="abMeasure">📐 Ölçüm çalıştır</button>
            </div>
            <div id="abMeasureOut">${d.lastMeasure ? renderMeasureHtml({ results: d.lastMeasure.results, target: d.target, tol: d.tol, at: d.lastMeasure.at }) : '<p class="foot" style="text-align:left">Henüz ölçüm yok.</p>'}</div>
          </section>
          ${anyOverride ? '<div class="modact" style="margin:14px 0"><button class="danger" id="abrstall">↺ Tümünü varsayılana döndür</button></div>' : ''}
          ${sections}
          <section><h2>Değişiklik geçmişi</h2>${hist}</section>`;

        document.querySelectorAll('.abset').forEach((b) => (b.onclick = () => setAIBeh(b.dataset.k)));
        document
          .querySelectorAll('.abrst')
          .forEach((b) => (b.onclick = () => resetAIBeh(b.dataset.k)));
        const all = $('#abrstall');
        if (all)
          all.onclick = async () => {
            if (!confirm('Tüm YZ güç ayarlarını varsayılana döndür?')) return;
            await post('/ai-behavior/reset', { all: true });
            loadAIBeh();
          };
        $('#abMeasure').onclick = runMeasure;
      }

      async function runMeasure() {
        const btn = $('#abMeasure');
        const out = $('#abMeasureOut');
        const matches = Number($('#abMatches').value) || ABDATA.matchesDefault;
        btn.disabled = true;
        out.innerHTML =
          '<p class="foot" style="text-align:left">Ölçüm çalışıyor… (birkaç saniye sürebilir)</p>';
        try {
          const r = await post('/ai-behavior/measure', { matches });
          const m = await r.json();
          if (r.status === 409) {
            out.innerHTML =
              '<div class="rec"><b>Meşgul</b><span>Başka bir ölçüm çalışıyor — birazdan tekrar dene.</span></div>';
            return;
          }
          if (!r.ok || m.error) {
            out.innerHTML = `<div class="rec"><b>Ölçüm başarısız</b><span>${esc(m.error || 'hata')}${m.detail ? ' · ' + esc(m.detail) : ''}</span></div>`;
            return;
          }
          out.innerHTML =
            `<p class="foot" style="text-align:left">${m.cached ? '♻️ önbellekten · ' : ''}havuz ${m.poolSize} · ${m.matches} maç/kol</p>` +
            renderMeasureHtml(m);
        } catch (e) {
          out.innerHTML = `<div class="rec"><b>Hata</b><span>${esc(e.message)}</span></div>`;
        } finally {
          btn.disabled = false;
        }
      }

      async function setAIBeh(key) {
        const inp = document.querySelector(`.abval[data-k="${key}"]`);
        const value = Number(inp.value);
        const min = +inp.dataset.min,
          max = +inp.dataset.max;
        if (!Number.isFinite(value) || value < min || value > max) {
          alert(`Aralık dışı: ${min}–${max} arası bir değer gir.`);
          return;
        }
        const r = await post('/ai-behavior/set', { key, value });
        if (r.status === 400) alert('Sunucu reddetti (aralık dışı).');
        loadAIBeh();
      }
      async function resetAIBeh(key) {
        await post('/ai-behavior/reset', { key });
        loadAIBeh();
      }

      // --- Ortak yükleme / sekme ---
      async function loadSummary() {
        const base = location.pathname.replace(/\/$/, '');
        try {
          const r = await fetch(base + '/summary?range=' + range, {
            headers: { accept: 'application/json' },
          });
          if (!checkAuth(r)) return;
          if (!r.ok) throw new Error('http ' + r.status);
          render(await r.json());
        } catch (e) {
          $('#main').innerHTML = `<div class="empty">Veri alınamadı: ${esc(e.message)}</div>`;
        }
      }

      let tab = 'summary';
      function load() {
        $('#main').innerHTML = '<p class="empty">Yükleniyor…</p>';
        stopRoomsTimer();
        openRoom = null;
        if (tab === 'rooms') {
          startRoomsTimer();
          return loadRooms();
        }
        if (tab === 'daily') return loadDaily();
        if (tab === 'balance') return loadBalance();
        if (tab === 'ai') return loadAI();
        if (tab === 'aibeh') return loadAIBeh();
        return tab === 'words' ? loadWords() : loadSummary();
      }

      // Oturum dolduysa (401) girişe dön.
      function checkAuth(r) {
        if (r.status === 401) {
          location.reload();
          return false;
        }
        return true;
      }

      $('#logout').addEventListener('click', async () => {
        const base = location.pathname.replace(/\/$/, '');
        try {
          await fetch(base + '/logout', { method: 'POST' });
        } catch {
          /* yoksay */
        }
        location.reload();
      });

      $('#tabs').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        tab = b.dataset.t;
        [...$('#tabs').children].forEach((x) => x.classList.toggle('on', x === b));
        load();
      });
      $('#ranges').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        range = b.dataset.r;
        [...$('#ranges').children].forEach((x) => x.classList.toggle('on', x === b));
        load();
      });
      load();
    </script>
  </body>
</html>
