<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kelimebaz — Yönetim Girişi</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14161a;
        color: #e8eaed;
      }
      .card {
        width: 320px;
        background: #1e2127;
        border: 1px solid #2c313a;
        border-radius: 14px;
        padding: 26px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        color: #9aa0a6;
        font-size: 13px;
        margin: 0 0 18px;
      }
      label {
        font-size: 13px;
        color: #9aa0a6;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin: 6px 0 14px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #2c313a;
        background: #14161a;
        color: #e8eaed;
        font: inherit;
      }
      button {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: #3a7afe;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .msg {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
        color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <form class="card" id="f">
      <h1>🔒 Yönetim Girişi</h1>
      <p>Kelimebaz yönetim panosu</p>
      <label for="pw">Parola</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus />
      <button id="btn" type="submit">Giriş</button>
      <div class="msg" id="msg"></div>
    </form>
    <script>
      const f = document.getElementById('f');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        btn.disabled = true;
        try {
          const base = location.pathname.replace(/\/$/, '');
          const r = await fetch(base + '/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('pw').value }),
          });
          if (r.ok) {
            location.reload();
            return;
          }
          if (r.status === 429) msg.textContent = 'Çok fazla deneme. Biraz bekleyin.';
          else if (r.status === 400) msg.textContent = 'Panel yalnızca HTTPS üzerinden açılır.';
          else if (r.status === 503)
            msg.textContent = 'Panel yapılandırılmamış (ADMIN_PASS_HASH yok).';
          else msg.textContent = 'Parola hatalı.';
        } catch {
          msg.textContent = 'Bağlantı hatası.';
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
