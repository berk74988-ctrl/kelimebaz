name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal/PR için yeni push gelince önceki koşuyu iptal et (kaynak israfı olmasın).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── HARD GATE: her push/PR'de derleme + birim testler + biçim + i18n ──
  build:
    name: Derleme + birim testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # doğru Node sürümü (engines ile uyumlu)
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Biçim kontrolü (prettier)
        run: npm run format:check

      - name: Çeviri tutarlılığı (i18n)
        run: npm run check:i18n

      - name: Birim testleri (vitest)
        run: npm test -- --watch=false

      - name: Üretim derlemesi
        run: npm run build

      - name: YZ çözücü + karakter mantığı (tarayıcısız)
        run: |
          npm run check:vsai
          npm run check:persona

      # Oda sunucusu güvenliği (rate-limit/CORS/küfür/dup/kalıcılık) — Linux'ta
      # gerçek SIGTERM round-trip'i de koşar (tarayıcısız, kendi sunucusunu açar).
      - name: Oda sunucusu güvenlik kontrolleri
        run: npm run check:rooms

      - name: Derleme çıktısını yükle (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  # ── Playwright uçtan uca kontroller (ayrı iş — tarayıcı kurulumu gerekir) ──
  e2e:
    name: Playwright uçtan uca kontroller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Playwright tarayıcısı (chromium)
        run: npx playwright install --with-deps chromium

      - name: Geliştirme sunucusunu başlat (localhost:4200)
        run: |
          npm start > ngserve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200/ >/dev/null; then echo "ng serve hazır (${i}x2sn)"; break; fi
            sleep 2
          done
          curl -sf http://localhost:4200/ >/dev/null || (echo "ng serve başlamadı"; cat ngserve.log; exit 1)

      # Playwright kontrolleri CI'da KOŞAR ve raporlanır, ama BUILD'i engellemez:
      # tarayıcı e2e kontrolleri zamanlamaya duyarlı (headless/yavaş koşucuda
      # klavye olayları düşebiliyor) → flaky yüzünden CI'yı yanlışlıkla kırmızıya
      # çevirmesinler. Asıl kapı "build" işi (birim testler + derleme). Sonuçlar
      # aşağıdaki özette + artefakt loglarında görünür. Bir kontrol kararlı hâle
      # getirildikçe engelleyiciye terfi ettirilebilir.
      - name: Playwright kontrolleri (bilgilendirici — engellemez)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p e2e-logs
          pass=0
          fail=0
          failed=""
          for c in a11y contrast scenarios dictionary shop audio responsive share profile gold; do
            echo "::group::check:$c"
            if npm run check:$c 2>&1 | tee "e2e-logs/$c.log"; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              failed="$failed $c"
            fi
            echo "::endgroup::"
          done
          echo "SONUÇ: $pass geçti · $fail başarısız —${failed:- hepsi geçti}"
          echo "### Playwright kontrolleri: ${pass} ✓ / ${fail} ✗${failed:+ (başarısız:$failed)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Kontrol loglarını yükle (artefakt — hata nedeni burada)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-logs/
            ngserve.log
          retention-days: 7
          if-no-files-found: ignore
