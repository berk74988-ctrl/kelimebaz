<!-- @dsCard group="Oyun · Kutular" -->
<!doctype html>
<html lang="tr" data-theme="dark" data-contrast="high">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harf Kutuları · Renk Körü Modu</title>
    <style>
      :root {
        --bg: #10131a; --surface: #191e28; --border: #2e3646; --text: #eef2f7; --text-muted: #93a1b1;
        /* Yüksek kontrast (renk körü): mavi = doğru, turuncu = var */
        --correct: #1668c4; --present: #e07b39; --absent: #3a4150;
        --on-correct: #ffffff; --on-present: #241002; --on-absent: #eef2f7;
        --tile-border: #2e3646; --tile-border-filled: #55617a;
        --mono: 'JetBrains Mono', Consolas, ui-monospace, monospace;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 28px; }
      h1 { font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 4px; }
      p.sub { margin: 0 0 18px; color: var(--text-muted); font-size: 13px; }
      .states { display: flex; gap: 14px; flex-wrap: wrap; }
      .state { text-align: center; }
      .tile {
        width: 58px; height: 58px; display: grid; place-items: center;
        font-family: var(--mono); font-size: 28px; font-weight: 700;
        border-radius: 15px; border: 2px solid var(--tile-border);
      }
      .tile.correct { background: var(--correct); color: var(--on-correct); border-color: var(--correct); }
      .tile.present { background: var(--present); color: var(--on-present); border-color: var(--present); }
      .tile.absent { background: var(--absent); color: var(--on-absent); border-color: var(--absent); }
      .lbl { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <h1>Harf Kutuları · Renk körü modu</h1>
    <p class="sub">Kırmızı-yeşil ayrımı yerine <b>mavi / turuncu</b> — herkes ayırt edebilir.</p>
    <div class="states">
      <div class="state"><div class="tile correct">A</div><div class="lbl">doğru yerde</div></div>
      <div class="state"><div class="tile present">L</div><div class="lbl">kelimede var</div></div>
      <div class="state"><div class="tile absent">E</div><div class="lbl">kelimede yok</div></div>
    </div>
  </body>
</html>
