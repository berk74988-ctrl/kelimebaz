<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toast & Rozetler</title>
    <style>
      :root {
        --bg: #0c1a1e; --surface: #13282b; --border: #2a4a4f; --text: #eaf4f4; --text-muted: #8aa8ab;
        --toast-bg: #eaf4f4; --on-toast: #0c1a1e; --accent: #2fd6c4; --present: #d9a441; --correct: #4caf82;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 28px; }
      h1 { font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 18px; }
      .toast {
        display: inline-block; background: var(--toast-bg); color: var(--on-toast);
        font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); margin-bottom: 22px;
      }
      .badges { display: flex; gap: 10px; flex-wrap: wrap; }
      .badge { font-size: 12px; padding: 4px 11px; border-radius: 999px; background: #0e1620; color: var(--text-muted); border: 1px solid var(--border); }
      .badge.ok { background: color-mix(in srgb, var(--correct) 16%, transparent); color: var(--correct); border-color: transparent; }
      .badge.warn { background: color-mix(in srgb, var(--present) 18%, transparent); color: var(--present); border-color: transparent; }
    </style>
  </head>
  <body>
    <h1>Toast & Rozetler</h1>
    <div class="toast">Sözlükte yok</div>
    <div class="badges">
      <span class="badge">İsim</span>
      <span class="badge ok">✓ onaylı</span>
      <span class="badge warn">⚠ filtreli</span>
      <span class="badge">🔒 kilitli</span>
    </div>
  </body>
</html>
