<!-- @dsCard group="Butonlar" -->
<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Butonlar</title>
    <style>
      :root {
        --bg: #0c1a1e; --surface: #13282b; --surface-2: #1c363a; --border: #2a4a4f;
        --text: #eaf4f4; --text-muted: #8aa8ab; --accent: #2fd6c4; --danger: #e0625c;
        --share-1: #0e7490; --share-2: #1560a8; --radius: 15px;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 28px; }
      h1 { font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 18px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
      button { font: inherit; cursor: pointer; border: 0; border-radius: var(--radius); padding: 12px 22px; font-weight: 700; font-size: 15px; }
      .primary { background: var(--accent); color: #fff; }
      .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
      .danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .share { background: linear-gradient(90deg, var(--share-1), var(--share-2)); color: #fff; }
      .pill { border-radius: 999px; padding: 9px 18px; font-size: 14px; }
      .icon { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); color: var(--text); display: grid; place-items: center; padding: 0; font-size: 18px; }
      .lbl { color: var(--text-muted); font-size: 12px; width: 100%; margin: 0 0 -6px; }
    </style>
  </head>
  <body>
    <h1>Butonlar</h1>
    <p class="lbl">Birincil eylemler</p>
    <div class="row">
      <button class="primary">Oyna</button>
      <button class="ghost">Geri</button>
      <button class="danger">Sıfırla</button>
      <button class="share">Sonucu Paylaş</button>
    </div>
    <p class="lbl">Hap (segment/ikincil)</p>
    <div class="row">
      <button class="primary pill">Günün Kelimesi</button>
      <button class="ghost pill">Serbest</button>
      <button class="ghost pill">🪙 20</button>
    </div>
    <p class="lbl">Simge butonları (başlık çubuğu)</p>
    <div class="row">
      <button class="icon">←</button>
      <button class="icon">👁</button>
      <button class="icon">📊</button>
      <button class="icon">🌙</button>
    </div>
  </body>
</html>
