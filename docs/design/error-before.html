<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #10131a; --surface: #191e28; --border: #2e3646; --text: #eef2f7; --text-muted: #93a1b1;
        --correct: #4caf82; --on-correct: #062012; --radius: 12px; --radius-lg: 20px;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; }
      body { font-family: var(--font); background: var(--bg); color: var(--text); }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card { width: 100%; max-width: 380px; text-align: center; padding: 40px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
      .ico { font-size: 40px; line-height: 1; }
      h1 { margin-top: 16px; font-size: 20px; }
      .msg { margin-top: 8px; font-size: 13.5px; line-height: 1.6; color: var(--text-muted); }
      .btn { width: 100%; margin-top: 24px; padding: 12px; font-size: 14px; font-weight: 800; border: 0; border-radius: var(--radius); color: var(--on-correct); background: var(--correct); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card" role="alert">
        <p class="ico">😕</p>
        <h1>Oyun başlatılamadı</h1>
        <p class="msg">Kelime listesi yüklenemedi. Bu genelde geçici bir sorundur — tekrar denemek çoğu zaman çözer.</p>
        <button class="btn">Tekrar dene</button>
      </section>
    </main>
  </body>
</html>
