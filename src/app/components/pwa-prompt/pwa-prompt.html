@if (pwa.updateReady()) {
  <div class="pwa-bar update" role="status">
    <span class="pwa-ico" aria-hidden="true">✨</span>
    <span class="pwa-tx"><b>{{ i18n.t('pwa.updateTitle') }}</b></span>
    <button class="pwa-btn primary" type="button" (click)="pwa.applyUpdate()">
      {{ i18n.t('pwa.updateBtn') }}
    </button>
  </div>
}

@if (showInstall()) {
  <div class="pwa-bar install" role="dialog" [attr.aria-label]="i18n.t('pwa.installTitle')">
    <span class="pwa-ico" aria-hidden="true">📲</span>
    <span class="pwa-tx">
      <b>{{ i18n.t('pwa.installTitle') }}</b>
      <span>{{ i18n.t('pwa.installBody') }}</span>
    </span>
    <span class="pwa-actions">
      <button class="pwa-btn ghost" type="button" (click)="pwa.dismissInstall()">
        {{ i18n.t('pwa.installLater') }}
      </button>
      <button class="pwa-btn primary" type="button" (click)="pwa.promptInstall()">
        {{ i18n.t('pwa.installBtn') }}
      </button>
    </span>
  </div>
}
