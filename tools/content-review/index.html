<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kelimebaz — İçerik Denetimi</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #14161a;
        color: #e8eaed;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 18px;
        border-bottom: 1px solid #2c313a;
        position: sticky;
        top: 0;
        background: #14161a;
      }
      select,
      input,
      button {
        font: inherit;
        color: #e8eaed;
        background: #1e2127;
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 7px 10px;
      }
      button {
        cursor: pointer;
      }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: #2c313a;
        overflow: hidden;
        flex: 1;
        min-width: 120px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: #46c93a;
      }
      .muted {
        color: #9aa0a6;
        font-size: 13px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 22px 18px 80px;
      }
      .word {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .flags {
        margin: 8px 0;
      }
      .flag {
        display: inline-block;
        background: #4a1d1d;
        color: #ffb4b4;
        border: 1px solid #7a2b2b;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 13px;
        margin-right: 6px;
      }
      .field {
        margin: 10px 0;
        padding: 10px 12px;
        background: #1e2127;
        border: 1px solid #2c313a;
        border-radius: 10px;
      }
      .field .k {
        font-size: 12px;
        color: #9aa0a6;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .field .v {
        font-size: 18px;
        margin-top: 3px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .field .v:empty::after {
        content: '(boş)';
        color: #e5484d;
      }
      .status {
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 13px;
      }
      .s-approved {
        background: #17361a;
        color: #7ee787;
      }
      .s-rejected {
        background: #3a1618;
        color: #ff9b9b;
      }
      .s-edited {
        background: #163149;
        color: #86c5ff;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .actions button {
        font-size: 16px;
        font-weight: 600;
        padding: 12px 18px;
      }
      .approve {
        background: #1c7a2b;
        border-color: #1c7a2b;
      }
      .reject {
        background: #a12d31;
        border-color: #a12d31;
      }
      .edit {
        background: #1f5a8a;
        border-color: #1f5a8a;
      }
      #reason {
        flex: 1;
        min-width: 140px;
      }
      kbd {
        background: #2c313a;
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 12px;
      }
      .hint {
        margin-top: 22px;
        font-size: 13px;
        color: #9aa0a6;
      }
      .done {
        text-align: center;
        font-size: 20px;
        padding: 40px;
      }
    </style>
  </head>
  <body>
    <header>
      <select id="source"></select>
      <select id="filter" title="Filtre">
        <option value="unreviewed">Denetlenmemişler</option>
        <option value="all">Tümü</option>
        <option value="rejected">Reddedilenler</option>
        <option value="flagged">Ön işaretliler</option>
      </select>
      <div class="bar"><i id="progbar"></i></div>
      <span class="muted" id="prog"></span>
    </header>

    <main id="main"><p class="muted">Yükleniyor…</p></main>

    <script>
      const $ = (s) => document.querySelector(s);
      const api = (p, opt) => fetch(p, opt).then((r) => r.json());
      let SRC = null,
        TYPE = null,
        ITEMS = [],
        DEC = {},
        view = [],
        idx = 0;

      async function loadSources() {
        const list = await api('/api/sources');
        const sel = $('#source');
        sel.innerHTML = list
          .map(
            (s) =>
              `<option value="${s.key}">${s.label} — ${
                s.total < 0 ? 'dosya yok' : `${s.reviewed}/${s.total} · ✗${s.rejected}`
              }</option>`,
          )
          .join('');
        if (list.length) selectSource(list[0].key);
      }

      async function selectSource(key) {
        const d = await api('/api/items?source=' + encodeURIComponent(key));
        SRC = d.source;
        TYPE = d.type;
        ITEMS = d.items;
        DEC = d.decisions || {};
        rebuild();
      }

      function rebuild() {
        const f = $('#filter').value;
        view = ITEMS.filter((it) => {
          const st = DEC[it.id]?.status;
          if (f === 'unreviewed') return !st;
          if (f === 'rejected') return st === 'rejected';
          if (f === 'flagged') return (it.preflags || []).length > 0;
          return true;
        });
        idx = 0;
        render();
        updateProgress();
      }

      function updateProgress() {
        const total = ITEMS.length;
        const reviewed = ITEMS.filter((it) => DEC[it.id]).length;
        const rejected = ITEMS.filter((it) => DEC[it.id]?.status === 'rejected').length;
        $('#progbar').style.width = total ? (reviewed / total) * 100 + '%' : '0';
        $('#prog').textContent = `${reviewed}/${total} denetlendi · ✗${rejected} red · görünen ${view.length}`;
      }

      function render() {
        const m = $('#main');
        if (!view.length) {
          m.innerHTML = `<div class="done">🎉 Bu filtrede denetlenecek kayıt yok.</div>`;
          return;
        }
        if (idx >= view.length) idx = view.length - 1;
        const it = view[idx];
        const dec = DEC[it.id];
        const statusHtml = dec
          ? `<span class="status s-${dec.status}">${
              { approved: '✓ onaylı', rejected: '✗ red', edited: '✎ düzeltildi' }[dec.status]
            }${dec.reason ? ' — ' + esc(dec.reason) : ''}</span>`
          : '';
        m.innerHTML = `
          <div class="muted">${idx + 1} / ${view.length}${it.primary !== 'word' ? '' : ' · kelime'}</div>
          <div class="word">${esc(it.word)}</div>
          <div class="flags">${(it.preflags || [])
            .map((f) => `<span class="flag">⚠ ${esc(f)}</span>`)
            .join('')} ${statusHtml}</div>
          ${it.fields
            .map((f) => `<div class="field"><div class="k">${esc(f.label)}</div><div class="v">${esc(f.value)}</div></div>`)
            .join('')}
          <div class="actions">
            <button class="approve" onclick="decide('approved')">✓ Onayla <kbd>a</kbd></button>
            <button class="reject" onclick="decide('rejected')">✗ Reddet <kbd>r</kbd></button>
            <button class="edit" onclick="startEdit()">✎ Düzelt <kbd>e</kbd></button>
            <input id="reason" placeholder="Red gerekçesi (istem iyileştirmesi için)" />
          </div>
          <div class="actions">
            <button onclick="move(-1)">← Önceki <kbd>k</kbd></button>
            <button onclick="move(1)">Sonraki → <kbd>j</kbd></button>
            <button onclick="decide('clear')">↺ Geri al <kbd>u</kbd></button>
          </div>
          <div class="hint">Kısayollar: <kbd>a</kbd> onayla · <kbd>r</kbd> reddet · <kbd>e</kbd> düzelt · <kbd>j</kbd>/<kbd>k</kbd> ileri/geri · <kbd>u</kbd> geri al</div>`;
      }

      function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }

      async function post(id, status, edited, reason) {
        await fetch('/api/decision', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ source: SRC, id, status, edited, reason }),
        });
      }

      async function decide(status) {
        const it = view[idx];
        if (!it) return;
        if (status === 'clear') {
          delete DEC[it.id];
          await post(it.id, 'clear');
          render();
          updateProgress();
          return;
        }
        let reason = '';
        if (status === 'rejected') {
          reason = ($('#reason')?.value || '').trim() || (it.preflags || []).join(', ') || 'elle red';
        }
        DEC[it.id] = { status, ...(reason ? { reason } : {}) };
        await post(it.id, status, undefined, reason);
        updateProgress();
        autoAdvance();
      }

      function startEdit() {
        const it = view[idx];
        if (!it) return;
        // primary alanın mevcut değeri
        let cur, key;
        if (it.primary === 'word') {
          cur = it.word;
          key = 'word';
        } else {
          const f = it.fields.find((x) => x.k === it.primary);
          cur = f?.value ?? '';
          key = it.primary;
        }
        const next = prompt('Düzeltilmiş metin:', cur);
        if (next == null || next === cur) return;
        DEC[it.id] = { status: 'edited' };
        post(it.id, 'edited', { [key]: next });
        // yerelde de yansıt
        if (key === 'word') it.word = next;
        else {
          const f = it.fields.find((x) => x.k === key);
          if (f) f.value = next;
        }
        updateProgress();
        autoAdvance();
      }

      function autoAdvance() {
        const f = $('#filter').value;
        if (f === 'unreviewed') {
          // denetlenen kayıt bu filtreden düşer → aynı indekste bir sonraki gelir
          view = view.filter((it) => !DEC[it.id] || it.id !== view[idx].id);
          if (idx >= view.length) idx = Math.max(0, view.length - 1);
          render();
        } else {
          move(1);
        }
      }

      function move(d) {
        if (!view.length) return;
        idx = Math.min(view.length - 1, Math.max(0, idx + d));
        render();
      }

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        const k = e.key.toLowerCase();
        if (k === 'a') decide('approved');
        else if (k === 'r') decide('rejected');
        else if (k === 'e') startEdit();
        else if (k === 'j' || e.key === 'ArrowRight') move(1);
        else if (k === 'k' || e.key === 'ArrowLeft') move(-1);
        else if (k === 'u') decide('clear');
      });

      $('#source').addEventListener('change', (e) => selectSource(e.target.value));
      $('#filter').addEventListener('change', rebuild);
      loadSources();
    </script>
  </body>
</html>
